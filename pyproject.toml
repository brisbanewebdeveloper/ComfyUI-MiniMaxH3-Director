[project]
name = "minimaxh3-director"
description = "NG project planning and native loop rendering for MiniMax H3, reusable media contexts and optional analysis, alongside the Legacy timeline Director."
version = "1.0.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Nothing beyond what ComfyUI itself already installs.
dependencies = []
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
]

[project.urls]
Repository = "https://github.com/seesee75-commits/ComfyUI-MiniMaxH3-Director"
"Bug Tracker" = "https://github.com/seesee75-commits/ComfyUI-MiniMaxH3-Director/issues"

[tool.comfy]
# Must match the publisher you create at https://registry.comfy.org
PublisherId = "seesee75-commits"
DisplayName = "MiniMax H3 Director"
Icon = ""
# NG depends on native List loops; this release is validated against ComfyUI 0.37.0.
requires-comfyui = ">=0.37.0"
